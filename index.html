<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Light Project</title>

    <style>
        /* ---------- General Styling ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        /* ---------- Main Card ---------- */

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;

            padding: 45px 30px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(12px);
        }

        /* ---------- Headings ---------- */

        h1 {
            font-size: 42px;
            margin-bottom: 10px;

            background: linear-gradient(90deg, #facc15, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 28px;
            margin-top: 20px;
            color: #f8fafc;
        }

        .description {
            margin: 15px auto 30px;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 450px;
        }

        /* ---------- Light Area ---------- */

        .light-box {
            margin: 25px auto;
            padding: 25px;

            width: 220px;
            height: 220px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.04);

            transition: 0.4s ease;
        }

        .light-box:hover {
            transform: scale(1.05);
        }

        #myImage {
            width: 130px;
            height: 130px;
            object-fit: contain;

            transition: 0.4s ease;
        }

        /* ---------- Buttons ---------- */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;

            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .on-btn {
            background: #facc15;
            color: #422006;
        }

        .off-btn {
            background: #334155;
            color: white;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .on-btn:hover {
            background: #fde047;
        }

        .off-btn:hover {
            background: #475569;
        }

        /* ---------- Footer ---------- */

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #64748b;
        }

        /* ---------- Mobile Responsive ---------- */

        @media (max-width: 500px) {

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hey! Everyone 👋</h1>

        <p class="subtitle">Let's Learn JavaScript 🚀</p>

        <h2>What Can JavaScript Do?</h2>

        <p class="description">
            JavaScript can change HTML attribute values dynamically.
            In this project, JavaScript controls the light by changing
            the image source.
        </p>

        <!-- Light -->
        <div class="light-box">
            <img id="myImage" src="off.png" alt="Light Bulb">
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button
                class="on-btn"
                onclick="document.getElementById('myImage').src='on.png'">
                💡 Turn On
            </button>

            <button
                class="off-btn"
                onclick="document.getElementById('myImage').src='off.png'">
                🌙 Turn Off
            </button>

        </div>

        <p class="footer">
            Built while learning JavaScript fundamentals ✨
        </p>

    </div>

</body>
</html>
